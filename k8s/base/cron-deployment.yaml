# Cron orchestrator: a long-running pod that runs node-cron internally.
# Every CRON_SCHEDULE tick it fetches workspace IDs from the API, then (in
# EXECUTION_MODE=kubernetes) creates one K8s Job per workspace that curls
# POST /api/workspaces/:id/analyze.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threadwise-cron
  namespace: threadwise
  labels:
    app: threadwise
    component: cron
spec:
  replicas: 1 # MUST stay 1: the isRunning overlap guard is in-memory only
  strategy:
    type: Recreate # never run old + new cron at the same time during a rollout
  selector:
    matchLabels:
      app: threadwise
      component: cron
  template:
    metadata:
      labels:
        app: threadwise
        component: cron
    spec:
      # Bound to the threadwise-job-manager Role (rbac.yaml) so it can create Jobs
      serviceAccountName: threadwise-cron
      containers:
        - name: cron
          image: your-registry/threadwise-cron:latest # Dockerfile.cron, CMD node dist/cron/index.js
          imagePullPolicy: Always
          envFrom:
            # All non-secret settings: CRON_SCHEDULE, RUN_ON_START, EXECUTION_MODE,
            # API_URL, K8S_* (job settings), JIRA_* etc.
            - configMapRef:
                name: threadwise-config
          env:
            # config.ts validates these at startup in single-workspace mode,
            # so the cron needs them even though it never calls Slack/Jira itself.
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: threadwise-secrets
                  key: SLACK_BOT_TOKEN
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: threadwise-secrets
                  key: JIRA_API_TOKEN
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
