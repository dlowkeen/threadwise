apiVersion: v1
kind: ServiceAccount
metadata:
  name: threadwise-api
  namespace: threadwise
  labels:
    app: threadwise
    component: api

---
# Cron gets its own identity: it is the only component allowed to create Jobs (see rbac.yaml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: threadwise-cron
  namespace: threadwise
  labels:
    app: threadwise
    component: cron
